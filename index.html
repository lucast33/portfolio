<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lucas Tolman</title>
  <meta name="description" content="Portfolio of Lucas Tolman.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="space-invaders-hero.js" defer></script>
  <style>
    :root {
      --ink: #fff;
      --paper: #000;
      --px: 4px;                 /* size of one "pixel" in the UI chrome */
      --cursor: none;            /* filled in with the fighter sprite by script */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { background: var(--paper); color: var(--ink); }
    body {
      font-family: 'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    button { font: inherit; color: inherit; }

    .cabinet {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: minmax(320px, 1fr) auto;
    }
    space-invaders-hero { min-height: 320px; }

    /* ── pixel-art frame: square edges with the corners notched out ── */
    .pixel-frame {
      background: var(--paper);
      box-shadow:
        0 calc(-1 * var(--px)) 0 0 var(--ink),
        0 var(--px) 0 0 var(--ink),
        calc(-1 * var(--px)) 0 0 0 var(--ink),
        var(--px) 0 0 0 var(--ink);
    }

    /* the fighter, turned to point right, used as a cursor */
    .cursor {
      width: 17px;
      height: 19px;
      flex: none;
      margin: 0 1px;
      background: var(--cursor) center / 17px 19px no-repeat;
      image-rendering: pixelated;
      transform: rotate(90deg);
    }

    /* ── footer: the one button ── */
    .start {
      display: flex;
      justify-content: center;
      padding: 22px 16px max(30px, env(safe-area-inset-bottom));
    }
    .start-btn {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px 16px 16px;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.08em;
      border: 0;
      cursor: pointer;
    }
    .start-btn .cursor { animation: blink 1s steps(1, end) infinite; }
    .start-btn:focus { outline: none; }
    .start-btn:focus-visible { background: var(--ink); color: var(--paper); }
    .start-btn:focus-visible .cursor { filter: invert(1); animation: none; }
    @media (hover: hover) {
      .start-btn:hover { background: var(--ink); color: var(--paper); }
      .start-btn:hover .cursor { filter: invert(1); animation: none; }
    }

    /* ── stage-select menu ── */
    .menu {
      margin: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      max-width: calc(100vw - 32px);
      overflow: visible;
    }
    .menu::backdrop {
      /* 1-bit 50% dither so the game shows through */
      background-color: transparent;
      background-image: conic-gradient(#000 25%, transparent 0 50%, #000 0 75%, transparent 0);
      background-size: 4px 4px;
    }
    .menu[open] .panel { animation: boot 0.24s steps(6, end) both; }

    .panel {
      width: min(380px, calc(100vw - 40px));
      padding: 26px 22px 22px;
    }
    .menu-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
      margin-bottom: 26px;
    }
    .menu-head h2 {
      font-size: 14px;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .menu-head .alien {
      width: 22px;
      height: 16px;
      flex: none;
      background: var(--crab) center / 22px 16px no-repeat;
      image-rendering: pixelated;
    }
    .close {
      position: absolute;
      top: -16px;
      right: -12px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: none;
      font-size: 12px;
      cursor: pointer;
    }
    .close:hover, .close:focus-visible { outline: none; background: var(--ink); color: var(--paper); }

    .stages { list-style: none; padding: 0; display: grid; gap: 6px; }
    .stages li { opacity: 0; }
    .menu[open] .stages li { animation: appear 0s linear forwards; }
    .menu[open] .stages li:nth-child(1) { animation-delay: 0.26s; }
    .menu[open] .stages li:nth-child(2) { animation-delay: 0.34s; }
    .menu[open] .stages li:nth-child(3) { animation-delay: 0.42s; }

    /* word dead-centre, a fighter on each side pointing in at it */
    .stages a {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      padding: 15px 10px;
      font-size: 14px;
      line-height: 1;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.08em;
      outline: none;
    }
    .stages .cursor { visibility: hidden; justify-self: end; }
    .stages .cursor.r { justify-self: start; transform: rotate(-90deg); }
    .stages a.is-active .cursor { visibility: visible; animation: blink 0.8s steps(1, end) infinite; }
    .stages a.is-chosen { animation: chosen 0.09s steps(1, end) infinite; }
    .stages a.is-chosen .cursor { animation: none; }

    .hint {
      margin-top: 22px;
      font-size: 8px;
      line-height: 1.8;
      letter-spacing: 0.06em;
      text-align: center;
    }
    @media (hover: none) { .hint { display: none; } }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    @keyframes blink { 50% { visibility: hidden; } }
    @keyframes appear { to { opacity: 1; } }
    @keyframes boot {
      from { clip-path: inset(48% 0 48% 0); }
      to   { clip-path: inset(-8px -8px -8px -8px); }
    }
    @keyframes chosen {
      0%   { background: var(--ink); color: var(--paper); }
      50%  { background: transparent; color: var(--ink); }
    }

    @media (max-width: 520px) {
      .start-btn { font-size: 11px; }
      .stages a { font-size: 12px; padding: 14px 6px; gap: 14px; }
      .menu-head h2 { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .start-btn .cursor, .stages a.is-active .cursor { animation: none; }
      .menu[open] .panel { animation: none; }
      .menu[open] .stages li { animation-delay: 0s; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <h1 class="sr-only">Lucas Tolman</h1>

    <space-invaders-hero name="Lucas Tolman"></space-invaders-hero>

    <div class="start">
      <button class="start-btn pixel-frame" type="button" aria-haspopup="dialog" aria-controls="stage-menu">
        <span class="cursor" aria-hidden="true"></span>
        SELECT STAGE
      </button>
    </div>
  </main>

  <dialog class="menu" id="stage-menu" aria-labelledby="stage-title">
    <div class="panel pixel-frame">
      <div class="menu-head">
        <span class="alien" aria-hidden="true"></span>
        <h2 id="stage-title">SELECT STAGE</h2>
        <span class="alien" aria-hidden="true"></span>
        <button class="close" type="button" aria-label="Close menu">X</button>
      </div>

      <ol class="stages">
        <li><a href="/about" autofocus><span class="cursor" aria-hidden="true"></span><span class="name">ABOUT</span><span class="cursor r" aria-hidden="true"></span></a></li>
        <li><a href="/experience"><span class="cursor" aria-hidden="true"></span><span class="name">EXPERIENCE</span><span class="cursor r" aria-hidden="true"></span></a></li>
        <li><a href="/contact"><span class="cursor" aria-hidden="true"></span><span class="name">CONTACT</span><span class="cursor r" aria-hidden="true"></span></a></li>
      </ol>

      <p class="hint" aria-hidden="true">UP/DOWN MOVE &nbsp; ENTER SELECT &nbsp; ESC EXIT</p>
    </div>
  </dialog>

  <noscript>
    <nav style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;padding:0 16px 32px;font-size:11px">
      <a style="color:#fff" href="/about">ABOUT</a>
      <a style="color:#fff" href="/experience">EXPERIENCE</a>
      <a style="color:#fff" href="/contact">CONTACT</a>
    </nav>
  </noscript>

  <script>
    (() => {
      const openBtn = document.querySelector('.start-btn');
      const menu = document.getElementById('stage-menu');
      const closeBtn = menu.querySelector('.close');
      const links = [...menu.querySelectorAll('.stages a')];
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let leaving = false;

      // reuse the game's own sprites for the cursor and title aliens
      customElements.whenDefined('space-invaders-hero').then((Hero) => {
        if (!Hero.spriteURL) return;
        document.documentElement.style.setProperty('--cursor', `url(${Hero.spriteURL('ship')})`);
        document.documentElement.style.setProperty('--crab', `url(${Hero.spriteURL('crab')})`);
      });

      const activate = (a) => {
        links.forEach((l) => l.classList.toggle('is-active', l === a));
        if (document.activeElement !== a) a.focus({ preventScroll: true });
      };

      const open = () => {
        if (menu.open) return;
        leaving = false;
        links.forEach((l) => l.classList.remove('is-chosen'));
        menu.showModal();
        activate(links[0]);
      };

      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', () => menu.close());

      // click on the dithered backdrop closes the menu
      menu.addEventListener('click', (e) => { if (e.target === menu) menu.close(); });

      links.forEach((a) => {
        a.addEventListener('focus', () => activate(a));
        a.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') activate(a); });
        a.addEventListener('click', (e) => {
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;  // let new-tab clicks through
          e.preventDefault();
          if (leaving) return;
          leaving = true;
          activate(a);
          a.classList.add('is-chosen');
          setTimeout(() => { location.href = a.href; }, reduced.matches ? 0 : 520);
        });
      });

      menu.addEventListener('keydown', (e) => {
        const i = links.indexOf(document.activeElement);
        const step = { ArrowDown: 1, ArrowRight: 1, s: 1, ArrowUp: -1, ArrowLeft: -1, w: -1 }[e.key];
        if (step) {
          e.preventDefault();
          activate(links[(Math.max(i, 0) + step + links.length) % links.length]);
        } else if (e.key === ' ' && i >= 0) {
          e.preventDefault();
          links[i].click();
        }
      });

      // "press start": Enter or Space anywhere on the page opens the menu
      document.addEventListener('keydown', (e) => {
        if (menu.open || e.defaultPrevented || e.repeat) return;
        if ((e.key === 'Enter' || e.key === ' ') && (document.activeElement === document.body || !document.activeElement)) {
          e.preventDefault();
          open();
        }
      });

      // coming back via the browser's back button: start with the menu closed
      addEventListener('pageshow', (e) => { if (e.persisted && menu.open) menu.close(); });
    })();
  </script>
</body>
</html>
